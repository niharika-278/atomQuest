services:
  # PostgreSQL Database
  - type: pserv
    name: atomquest-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15

  # Redis Cache Service
  - type: pserv
    name: goal-portal-redis
    plan: free
    runtime: redis-7

  # Node.js Backend API
  - type: web
    name: goal-portal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: atomquest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: goal-portal-redis
          type: pserv
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: info

  # React Frontend (Static Site)
  - type: web
    name: goal-portal-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: goal-portal-api
          type: web
          property: url